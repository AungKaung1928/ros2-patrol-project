name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/patrol_navigation_project
      - name: Install dependencies (README quick start)
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select patrol_navigation_project --event-handlers console_direct+
      - name: Executable and launch file installed
        run: |
          source install/setup.bash
          ros2 pkg executables patrol_navigation_project | grep -q patrol
          test -f install/patrol_navigation_project/share/patrol_navigation_project/launch/patrol_navigation.launch.py
      - name: Launch test (node against a stand-in Nav2 action server)
        run: |
          source install/setup.bash
          cd src/patrol_navigation_project
          launch_test test/test_launch_retry.py
          launch_test test/test_launch_no_loop.py
          launch_test test/test_launch_bounded_retry.py
          launch_test test/test_launch_rejected.py
      - name: Route figure matches the config
        run: |
          cd src/patrol_navigation_project
          python3 scripts/plot_route.py
          git diff --exit-code docs/route.svg
      - name: Lint (ament flake8 + pep257 tests shipped in test/)
        run: |
          source install/setup.bash
          cd src/patrol_navigation_project
          # test_copyright.py is not run: the sources carry no copyright headers (license: LICENSE).
          python3 -m pytest test/test_flake8.py test/test_pep257.py -v
